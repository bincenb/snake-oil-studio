<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Anki-style flashcards, weekly study guides and timed practice quizzes for BIO 163 Medical Terminology.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="logo.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>BIO 163 Study Deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:ital,wght@0,400;0,500;0,700;1,400&family=Caveat:wght@500;700&display=swap">
<style>
  /* Layout: a clipboard on scrub-blue. Masthead left, plain text nav; the deck tree reads like Anki's
     deck browser with a handwritten margin note beside it. Cards are ruled index cards.
     Materials: ceil-blue scrubs, navy chart ink, index-card rules, highlighter, red pen.
     Anki's own colors mark New (blue), Learn (red) and Due (green). */
  :root {
    --bg: #DCE5EF;
    --sheet: #FBFCFD;
    --sheet-2: #F1F5F9;
    --ink: #17203A;
    --ink-2: #4E5A74;
    --ink-3: #8592A8;
    --rule: #C7D2DF;
    --scrub: #3E64A0;
    --pen: #C7372C;
    --hl: #F4E36A;
    --lines: #DCE7F4;
    --new: #2B68D0;
    --learn: #C7372C;
    --due: #23824A;
    --hard: #5D6880;
    --serif: 'Young Serif', Georgia, 'Times New Roman', serif;
    --sans: 'Figtree', 'Segoe UI', Helvetica, Arial, sans-serif;
    --hand: 'Caveat', 'Bradley Hand', 'Comic Sans MS', cursive;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10172A; --sheet: #182136; --sheet-2: #1E2840; --ink: #E5EAF4; --ink-2: #A3AEC4; --ink-3: #6E7A93;
      --rule: #2B3753; --scrub: #8DAEE6; --pen: #FF7468; --hl: rgba(240, 220, 90, .3); --lines: #1F2A44;
      --new: #7EA8FF; --learn: #FF7468; --due: #5FCB86; --hard: #A3AEC4;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10172A; --sheet: #182136; --sheet-2: #1E2840; --ink: #E5EAF4; --ink-2: #A3AEC4; --ink-3: #6E7A93;
    --rule: #2B3753; --scrub: #8DAEE6; --pen: #FF7468; --hl: rgba(240, 220, 90, .3); --lines: #1F2A44;
    --new: #7EA8FF; --learn: #FF7468; --due: #5FCB86; --hard: #A3AEC4;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.55;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--scrub); outline-offset: 3px; }
  .app { max-width: 1000px; margin: 0 auto; padding-block: 28px 80px; }

  /* Masthead */
  .mast { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px 32px; padding-bottom: 18px; border-bottom: 2px solid var(--ink); }
  .brand { display: flex; align-items: flex-end; gap: 14px; }
  .logo { width: 58px; height: 58px; flex: 0 0 auto; align-self: center; }
  .code { font-family: var(--serif); font-size: clamp(40px, 8vw, 58px); line-height: .9; letter-spacing: -.01em; }
  .code em { font-style: normal; background: linear-gradient(176deg, transparent 52%, var(--hl) 52%, var(--hl) 88%, transparent 88%); padding: 0 .06em; }
  .course { font-size: 14px; line-height: 1.3; color: var(--ink-2); padding-bottom: 4px; }
  .nav { display: flex; gap: 22px; }
  .nav button { background: none; border: 0; padding: 4px 0; font-weight: 700; font-size: 16px; color: var(--ink-2); border-bottom: 3px solid transparent; }
  .nav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--pen); }
  main { padding-top: 26px; }

  /* Shared bits */
  h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(28px, 5vw, 40px); line-height: 1.1; margin: 0; text-wrap: balance; }
  h3 { font-family: var(--serif); font-weight: 400; font-size: 24px; line-height: 1.2; margin: 0; }
  .lede { margin: 0; max-width: 64ch; color: var(--ink-2); font-size: 17px; }
  .hand { font-family: var(--hand); }
  .btn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 9px 15px; font-weight: 700; font-size: 15px; }
  .btn:hover { border-color: var(--ink-3); }
  .btn.solid { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
  .link { background: none; border: 0; padding: 2px 0; color: var(--scrub); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .n-new { color: var(--new); } .n-learn { color: var(--learn); } .n-due { color: var(--due); }
  .zero { color: var(--ink-3) !important; }

  /* Word-part coloring */
  .bd { font-size: 15px; display: inline-flex; flex-wrap: wrap; gap: 0 3px; align-items: baseline; letter-spacing: .01em; }
  .p { color: var(--new); font-weight: 700; }
  .r { color: var(--ink); font-weight: 700; }
  .v { color: var(--ink-3); }
  .s { color: var(--pen); font-weight: 700; }
  .wp { font-weight: 700; white-space: nowrap; }
  .wp.k-p { color: var(--new); } .wp.k-s { color: var(--pen); }

  /* Decks view */
  .decks { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 36px; align-items: start; }
  .tree { background: var(--sheet); border-radius: 4px; box-shadow: 0 1px 0 var(--rule), 0 14px 30px -22px rgba(10, 20, 50, .45); }
  .thead, .drow { display: grid; grid-template-columns: minmax(0, 1fr) 3.4em 3.4em 3.4em; align-items: center; column-gap: 4px; }
  .thead { padding: 14px 18px 10px; font-size: 13px; font-weight: 700; border-bottom: 2px solid var(--ink); }
  .thead span:not(:first-child), .drow .num { text-align: right; font-variant-numeric: tabular-nums; }
  .wk { border-bottom: 1px solid var(--rule); }
  .wk:last-child { border-bottom: 0; }
  .drow { width: 100%; text-align: left; background: none; border: 0; padding: 11px 18px; }
  .drow:hover { background: var(--sheet-2); }
  .drow .name { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .drow .name b { font-weight: 700; }
  .drow .name small { color: var(--ink-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drow .num { font-weight: 700; font-size: 15px; }
  .drow.root { padding-block: 16px; }
  .drow.root .name b { font-family: var(--serif); font-weight: 400; font-size: 20px; }
  .drow.sub { padding-left: 50px; }
  .drow.sub .name span { font-size: 15px; }
  .wkhead { display: flex; align-items: stretch; }
  .wkhead .drow { flex: 1; padding-left: 4px; }
  .chev { flex: 0 0 auto; width: 44px; background: none; border: 0; color: var(--ink-3); font-size: 13px; display: grid; place-items: center; }
  .chev span { display: inline-block; transition: transform .15s; }
  .chev[aria-expanded="true"] span { transform: rotate(90deg); }
  .tsec { padding: 18px 18px 8px; font-family: var(--hand); font-size: 22px; color: var(--ink-2); border-bottom: 1px solid var(--rule); }
  .cipx { display: grid; gap: 8px; max-width: 46ch; margin-top: 4px; }
  .cipx div { display: grid; }
  .cipx b { font-size: 17px; }
  .cipx span { color: var(--ink-2); font-size: 15px; }
  .cipx .rel { margin: 0; font-size: 14px; color: var(--ink-3); }
  .cipx .cnote { margin: 0; font-family: var(--hand); font-size: 20px; line-height: 1.2; color: var(--ink-2); }
  .ciptable td small { color: var(--ink-3); font-size: 13px; }
  .ciptable td:first-child { white-space: nowrap; }
  .weeks button.wide { width: auto; padding: 0 12px; font-family: var(--sans); font-weight: 700; font-size: 15px; }
  .meter { height: 3px; background: var(--sheet-2); margin: 0 18px 0 50px; border-radius: 2px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--due); }
  .aside { position: sticky; top: 20px; display: grid; gap: 18px; }
  .margin-note { font-family: var(--hand); font-size: 22px; line-height: 1.2; color: var(--ink-2); transform: rotate(-1.2deg); }
  .margin-note b { font-weight: 700; }
  .margin-note .a { color: var(--learn); } .margin-note .g { color: var(--due); } .margin-note .e { color: var(--new); }
  .stats { display: grid; gap: 2px; font-size: 14px; color: var(--ink-2); }
  .stats b { font-family: var(--serif); font-weight: 400; font-size: 30px; color: var(--ink); line-height: 1.1; font-variant-numeric: tabular-nums; }

  /* Study screen */
  .study { max-width: 680px; margin: 0 auto; display: grid; gap: 16px; }
  .crumbs { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .crumbs .path { font-weight: 700; }
  .crumbs .path span { color: var(--ink-2); font-weight: 500; }
  .counts { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .counts .cur { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
  .counts .plus { color: var(--ink-3); font-weight: 400; margin: 0 2px; }
  .card {
    position: relative; min-height: 340px; border-radius: 3px; background-color: var(--sheet);
    background-image: repeating-linear-gradient(to bottom, transparent 0 33px, var(--lines) 33px 34px);
    background-position: 0 12px;
    box-shadow: 0 1px 0 var(--rule), 0 18px 34px -24px rgba(10, 20, 50, .5);
    padding: 22px 26px 30px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px;
  }
  .card .kind { align-self: flex-start; font-size: 13px; color: var(--ink-2); text-align: left; }
  .card .kind b { color: var(--ink); }
  .q { font-family: var(--serif); font-size: clamp(32px, 7vw, 52px); line-height: 1.12; overflow-wrap: anywhere; margin-top: 26px; }
  .q.long { font-family: var(--sans); font-weight: 700; font-size: clamp(19px, 3.6vw, 24px); line-height: 1.4; max-width: 32ch; }
  .q-pre { font-family: var(--hand); font-size: 22px; color: var(--ink-2); margin-bottom: -12px; margin-top: 18px; }
  .redline { align-self: stretch; height: 0; border: 0; border-top: 2px solid var(--pen); opacity: .7; margin: 10px -26px 4px; }
  .a { font-size: clamp(19px, 3.6vw, 23px); font-weight: 700; max-width: 40ch; line-height: 1.4; }
  .a.big { font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 6vw, 44px); }
  .a-sub { color: var(--ink-2); max-width: 46ch; }
  .reveal { width: 100%; padding: 15px; border-radius: 6px; border: 0; background: var(--ink); color: var(--sheet); font-weight: 700; font-size: 17px; }
  .rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .rate button { display: grid; gap: 0; justify-items: center; padding: 6px 4px 11px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; font-weight: 700; font-size: 16px; }
  .rate button:hover { border-color: currentColor; }
  .rate .ivl { font-family: var(--hand); font-size: 19px; font-weight: 500; color: var(--ink-2); line-height: 1.2; }
  .r1 { color: var(--learn); } .r2 { color: var(--hard); } .r3 { color: var(--due); } .r4 { color: var(--new); }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); }
  .foot label { display: inline-flex; gap: 8px; align-items: center; }
  .foot select { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 8px; }
  .keys { font-size: 13px; color: var(--ink-3); text-align: center; margin: 0; }
  kbd { font-family: var(--sans); font-size: 12px; font-weight: 700; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--sheet); color: var(--ink-2); }
  .congrats { background: var(--sheet); border-radius: 4px; padding: 34px 26px; text-align: center; display: grid; gap: 14px; justify-items: center; box-shadow: 0 1px 0 var(--rule); }
  .congrats p { margin: 0; color: var(--ink-2); max-width: 46ch; }
  .reset { background: none; border: 0; color: var(--ink-3); font-size: 13px; text-decoration: underline; padding: 2px; }
  .reset.armed { color: var(--pen); font-weight: 700; }

  /* Week picker (guide + quiz) */
  .weeks { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 26px; }
  .weeks .lbl { font-size: 14px; color: var(--ink-2); margin-right: 6px; }
  .weeks button { width: 40px; height: 40px; border-radius: 6px; border: 1px solid var(--rule); background: var(--sheet); font-family: var(--serif); font-size: 18px; }
  .weeks button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }

  /* Guide */
  .guide { display: grid; gap: 34px; }
  .ghead { display: grid; gap: 12px; }
  .ghead .src { font-size: 14px; color: var(--ink-2); }
  .due { display: grid; gap: 6px; padding-left: 16px; border-left: 3px solid var(--pen); }
  .due b { font-size: 15px; }
  .due ul { margin: 0; padding-left: 18px; }
  .gtools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  .search { flex: 1 1 260px; max-width: 420px; display: flex; align-items: center; gap: 8px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 0 12px; }
  .search input { border: 0; background: transparent; padding: 10px 0; width: 100%; outline: none; }
  .search:focus-within { border-color: var(--scrub); }
  .jump { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 15px; }
  .jump a { color: var(--scrub); font-weight: 700; text-underline-offset: 3px; }
  .sec { display: grid; gap: 14px; scroll-margin-top: 16px; }
  .sec > h3 { padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
  .sec h4 { font-size: 15px; font-weight: 700; margin: 8px 0 0; color: var(--ink-2); }
  .notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 22px 34px; }
  .note { min-width: 0; }
  .note h5 { margin: 0 0 6px; font-size: 17px; font-weight: 700; display: inline; background: linear-gradient(176deg, transparent 55%, var(--hl) 55%, var(--hl) 90%, transparent 90%); }
  .note ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 5px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; color: var(--ink-2); }
  .tablewrap { overflow-x: auto; background: var(--sheet); border-radius: 4px; box-shadow: 0 1px 0 var(--rule); }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th, td { text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  th { font-size: 13px; font-weight: 700; color: var(--ink-2); }
  td.ex { color: var(--ink-2); }
  .terms { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px 34px; }
  .term { min-width: 0; display: grid; gap: 1px; align-content: start; }
  .term b { font-size: 17px; }
  .term p { margin: 0; color: var(--ink-2); }
  .watch { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px 34px; }
  .watch div { min-width: 0; }
  .watch b { display: block; color: var(--pen); }
  .watch span { color: var(--ink-2); }

  /* Quiz */
  .quiz { max-width: 720px; display: grid; gap: 18px; }
  .panel { background: var(--sheet); border-radius: 4px; padding: 24px; display: grid; gap: 18px; box-shadow: 0 1px 0 var(--rule), 0 14px 30px -24px rgba(10, 20, 50, .45); }
  .panel p { margin: 0; color: var(--ink-2); max-width: 62ch; }
  .field { display: grid; gap: 6px; }
  .field > span { font-size: 14px; font-weight: 700; }
  .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; width: fit-content; max-width: 100%; }
  .seg button { border: 0; background: var(--sheet); padding: 7px 14px; font-weight: 700; font-size: 15px; color: var(--ink-2); }
  .seg button + button { border-left: 1px solid var(--rule); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
  .panel select { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; max-width: 100%; }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; }
  .check input { accent-color: var(--ink); width: 17px; height: 17px; }
  .qhead { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .timer { height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
  .timer i { display: block; height: 100%; background: var(--scrub); transition: width .25s linear; }
  .timer.low i { background: var(--pen); }
  .qlabel { font-size: 15px; color: var(--ink-2); margin: 0 0 4px; }
  .qprompt { font-family: var(--serif); font-size: clamp(28px, 6vw, 42px); line-height: 1.15; overflow-wrap: anywhere; }
  .qprompt.long { font-family: var(--sans); font-weight: 700; font-size: clamp(18px, 3.4vw, 22px); line-height: 1.4; }
  .options { display: grid; gap: 8px; }
  .opt { text-align: left; border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 12px 14px; display: flex; gap: 12px; align-items: baseline; font-size: 16px; }
  .opt:hover:not(:disabled) { border-color: var(--ink-2); }
  .opt:disabled { cursor: default; }
  .opt.right { border-color: var(--due); box-shadow: inset 4px 0 0 var(--due); }
  .opt.wrong { border-color: var(--pen); box-shadow: inset 4px 0 0 var(--pen); }
  .feedback { display: grid; gap: 4px; }
  .feedback .ok { color: var(--due); font-family: var(--hand); font-size: 26px; line-height: 1; }
  .feedback .no { color: var(--pen); font-family: var(--hand); font-size: 26px; line-height: 1; }
  .score { display: flex; gap: 22px; flex-wrap: wrap; align-items: baseline; }
  .score .num { font-family: var(--serif); font-size: 68px; line-height: 1; font-variant-numeric: tabular-nums; }
  .score .grade { font-family: var(--hand); font-size: 60px; line-height: 1; color: var(--pen); transform: rotate(-6deg); display: inline-block; }
  .missed { display: grid; gap: 8px; }
  .missed div { padding-left: 12px; border-left: 3px solid var(--pen); }
  .scale { font-size: 13px; color: var(--ink-3); }

  @media (max-width: 860px) {
    .decks { grid-template-columns: 1fr; gap: 24px; }
    .aside { position: static; grid-template-columns: 1fr 1fr; align-items: start; }
  }
  @media (max-width: 560px) {
    .app { padding-block: 18px 64px; }
    .nav { width: 100%; justify-content: space-between; }
    .logo { width: 46px; height: 46px; } .brand { gap: 10px; }
    .thead, .drow { grid-template-columns: minmax(0, 1fr) 2.6em 2.6em 2.6em; }
    .thead { padding-inline: 12px; } .drow { padding-inline: 12px; } .drow.sub { padding-left: 40px; }
    .drow .name small { display: none; }
    .meter { margin: 0 12px 0 40px; }
    .chev { width: 36px; }
    .aside { grid-template-columns: 1fr; }
    .card { padding: 18px 18px 26px; min-height: 300px; }
    .redline { margin-inline: -18px; }
    .rate { gap: 6px; } .rate button { font-size: 15px; }
    .panel { padding: 18px; }
    .weeks { gap: 5px; } .weeks .lbl { display: none; } .weeks button { width: 34px; height: 36px; } .weeks button.wide { padding: 0 9px; }
  }
  @media (prefers-reduced-motion: reduce) { .chev span { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="mast">
    <div class="brand">
      <svg class="logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"> <rect width="64" height="64" rx="14" fill="#17203A"/> <g transform="rotate(-7 32 33)"> <rect x="9" y="15" width="46" height="35" rx="2.5" fill="#FBFCFD"/> <path d="M9 23.5h46" stroke="#C7372C" stroke-width="2"/> <path d="M9 31.5h46M9 39.5h46" stroke="#C9D8EC" stroke-width="1.2"/> <rect x="15" y="32.5" width="35" height="9" rx="1.5" fill="#F4E36A"/> <path d="M21.5 46 31 27" stroke="#17203A" stroke-width="4" stroke-linecap="round"/> <circle cx="40.5" cy="38" r="6" fill="none" stroke="#17203A" stroke-width="4"/> </g> </svg>
      <span class="code">BIO <em>163</em></span>
      <span class="course">Medical Terminology<br>Fall 2026, online</span>
    </div>
    <nav class="nav" aria-label="Sections">
      <button data-view="decks">Decks</button>
      <button data-view="guide">Study guide</button>
      <button data-view="quiz">Quiz</button>
    </nav>
  </header>
  <main id="view"></main>
</div>

<script>
const UNITS = [

const TYPE_LABEL = { part: "Word part", term: "Term", abbr: "Abbreviation", plural: "Plural" };
function buildUnitCards(u) {
  const out = [];
  Object.entries(u.parts || {}).forEach(([g, rows]) => rows.forEach(([f, b, ex]) => out.push({ type: "part", front: f, back: b, ex, group: g })));
  Object.entries(u.terms || {}).forEach(([g, rows]) => rows.forEach(([f, b, bd]) => out.push({ type: "term", front: f, back: b, bd, group: g })));
  (u.plurals || []).forEach(([f, b, rule]) => out.push({ type: "plural", front: f, back: b, ex: rule, group: "Plurals" }));
  (u.abbr || []).forEach(([f, b]) => out.push({ type: "abbr", front: f, back: b, group: "Abbreviations" }));
  Object.entries(u.abbrGroups || {}).forEach(([g, rows]) => rows.forEach(([f, b]) => out.push({ type: "abbr", front: f, back: b, group: g })));
  out.forEach(c => { c.unit = u.id; c.id = u.id + "|" + c.type + "|" + c.front; });
  return out;
}

UNITS.forEach(u => { if (u.id !== "w8") UNIT_CARDS[u.id] = buildUnitCards(u); });

/* ---------- Spaced repetition ----------
   The clock counts reviews, not days: a gap of 30 means "show it again after about 30 more cards".
   Again → 3 cards. Hard → small step. Good on a new card → 30, then the gap grows by the card's ease.
   Easy on a new card → 60. Cards with a gap of 30 or more count as learned. */
const LEARNED = 30;
const srs = store.get("srs", null) || { clock: 0, c: {} };
(function migrateV1() {
  const old = store.get("known", null);
  if (!old || !old.length || Object.keys(srs.c).length) return;
  old.forEach(id => { if (CARD[id]) srs.c[id] = { g: LEARNED, e: 2.5, d: Math.floor(Math.random() * LEARNED), r: 1, l: 0 }; });
  store.set("known", []);
})();
const saveSrs = () => store.set("srs", srs);
function nextState(s, rating) {
  s = s ? Object.assign({}, s) : { g: 0, e: 2.5, r: 0, l: 0 };
  const fresh = !s.g;
  if (rating === 1) { s.g = 3; s.e = Math.max(1.3, s.e - 0.2); if (!fresh) s.l++; }
  else if (rating === 2) { s.g = fresh ? 8 : Math.max(6, Math.round(s.g * 1.2)); s.e = Math.max(1.3, s.e - 0.15); }
  else if (rating === 3) { s.g = fresh ? LEARNED : Math.max(s.g + 4, Math.round(s.g * s.e)); }
  else { s.g = fresh ? 60 : Math.max(s.g + 10, Math.round(s.g * s.e * 1.3)); s.e += 0.15; }
  s.r++;
  return s;
}
function deckCounts(d) {
  let n = 0, l = 0, due = 0, learned = 0;
  for (const c of d.cards) {
    const s = srs.c[c.id];
    if (!s) n++;
    else if (s.g < LEARNED) l++;
    else { learned++; if (s.d <= srs.clock) due++; }
  }
  return { n, l, due, learned, total: d.cards.length };
}

}

/* ---------- Study session ---------- */
function openStudy(key) {
  const d = DECKS[key];
  const order = d.parent ? shuffle(d.cards.map(c => c.id)) : d.cards.map(c => c.id);
  S.st = { key, order, cur: null, kind: null, shown: false, ahead: false, undo: null, armed: false, done: 0 };
  pickNext(); renderStudy(); window.scrollTo({ top: 0 });
}
function pickNext() {
  const st = S.st; const C = srs.clock; const last = st.cur;
  const due = [], ahead = []; let fresh = null;
  for (const id of st.order) {
    const s = srs.c[id];
    if (!s) { if (!fresh && id !== last) fresh = id; continue; }
    if (s.d <= C) due.push(id); else ahead.push(id);
  }
  const notLast = arr => arr.length > 1 ? arr.filter(id => id !== last) : arr;
  const byDue = (a, b) => srs.c[a].d - srs.c[b].d;
  let pick = null, kind = null;
  const d = notLast(due).sort(byDue);
  if (d.length && !(d[0] === last && fresh)) { pick = d[0]; kind = srs.c[pick].g < LEARNED ? "learn" : "due"; }
  else if (fresh) { pick = fresh; kind = "new"; }
  else if (ahead.length) {
    if (!st.ahead) { st.cur = null; st.kind = "finished"; return; }
    pick = notLast(ahead).sort(byDue)[0]; kind = srs.c[pick].g < LEARNED ? "learn" : "due";
  } else if (due.length) { pick = due[0]; kind = "learn"; }
  st.cur = pick; st.kind = kind; st.shown = false;
}
function sideFor(id) {
  if (S.ask === "term") return "front";
  if (S.ask === "meaning") return "back";
  let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) | 0;
  return (h + srs.clock) % 2 ? "front" : "back";
}
function renderStudy() {
  const st = S.st; const d = DECKS[st.key]; const k = deckCounts(d);
  const path = d.key === "all" ? "Everything" : d.parent ? `${esc(d.name)} <span>${esc(d.sub)}</span>` : `${esc(DECKS[d.week].name)} <span>/ ${esc(d.name)}</span>`;
  const cnt = (v, cls, kind) => `<span class="${v ? cls : "zero"} ${st.kind === kind ? "cur" : ""}" title="${kind === "new" ? "New" : kind === "learn" ? "Learning" : "Due"}">${v}</span>`;
  const head = `<div class="crumbs">
      <button class="link" data-back>← Decks</button>
      <span class="path">${path}</span>
      <span class="counts">${cnt(k.n, "n-new", "new")}<span class="plus">+</span>${cnt(k.l, "n-learn", "learn")}<span class="plus">+</span>${cnt(k.due, "n-due", "due")}</span>
    </div>`;
  let body;
  if (st.kind === "finished" || !st.cur) {
    body = `<div class="congrats">
      <h3>Done for now</h3>
      <p>No new or due cards left in this deck. The ${k.learned} you've learned will come back as you keep reviewing. You can keep going to review early, or switch to another deck.</p>
      <div class="row" style="justify-content:center"><button class="btn solid" id="st-ahead">Keep reviewing early</button><button class="btn" data-back>Back to decks</button><button class="btn" data-quizdeck="${d.key}">Quiz this deck</button></div>
    </div>`;
  } else {
    const c = CARD[st.cur]; const side = sideFor(c.id);
    const qTxt = side === "front" ? c.front : c.back;
    const aTxt = side === "front" ? c.back : c.front;
    const where = st.key === "all" || d.parent ? `${unitById(c.unit) ? "Week " + unitById(c.unit).wk + ", " : ""}${c.group}` : c.group;
    const pre = c.type === "plural" ? (side === "front" ? "plural of" : "singular of") : (side === "back" ? (c.type === "abbr" ? "abbreviation for" : c.type === "part" ? "word part for" : "term for") : "");
    let ans = "";

    const controls = st.shown
      ? `<div class="rate" role="group" aria-label="How well did you know it?">

    body = `<article class="card" aria-live="polite">

      <span class="row">${st.undo ? `<button class="link" id="st-undo">Undo</button>` : ""}<button class="reset ${st.armed ? "armed" : ""}" id="st-reset">${st.armed ? "Tap again to reset this deck" : "Reset deck"}</button></span>
    </div>
  </section>`;
}
function rate(r) {
  const st = S.st; if (!st || !st.cur || !st.shown) return;
  const id = st.cur;

/* ---------- Quiz ---------- */
const GRADE = [[90, "A"], [85, "B+"], [80, "B"], [75, "C+"], [70, "C"], [65, "D+"], [60, "D"], [0, "F"]];
const letter = pct => GRADE.find(([m]) => pct >= m)[1];
const PACE = 120 * 60 / 220; // seconds per question on the real final
function quizDeckKey() {
  const def = S.unit === "w8" ? "all" : S.unit === "cip" ? "cip1" : S.unit;
  const k = S.qz.deck;
  if (!k || !DECKS[k]) return def;
  if (S.unit === "w8") return k;
  return unitOf(DECKS[k].week) === S.unit ? k : def;
}
function makeQuestion(c, pool) {
  const forward = c.type === "term" ? Math.random() < 0.55 : Math.random() < 0.5;
  const ans = forward ? c.back : c.front;
  const norm = s => s.toLowerCase().trim();
  const pickFrom = src => shuffle(src.filter(x => x.type === c.type && norm(x.back) !== norm(c.back) && norm(x.front) !== norm(c.front)));
  let cands = pickFrom(pool);
  if (cands.length < 3) cands = cands.concat(pickFrom(ALL.filter(x => x.unit !== c.unit)));
  const opts = []; const seen = new Set([norm(ans)]);
  for (const x of cands) { const t = forward ? x.back : x.front; if (!seen.has(norm(t))) { seen.add(norm(t)); opts.push(t); } if (opts.length === 3) break; }
  const options = shuffle([ans, ...opts]);
  const labels = {
    part: forward ? "What does this word part mean?" : "Which word part means…",
    term: forward ? "Which definition fits this term?" : "Which term matches this definition?",
    abbr: forward ? "What does this abbreviation stand for?" : "Which abbreviation means…",
    plural: forward ? "What is the plural of…" : "What is the singular of…"
  };
  const prompt = forward ? c.front : c.back;
  return { card: c, label: labels[c.type], prompt, long: isLong(prompt), options, correct: options.indexOf(ans) };
}
function startQuiz() {
  const pool = DECKS[quizDeckKey()].cards;
  const n = Math.min(S.qz.len, pool.length);
  Object.assign(S.qz, { phase: "q", qs: shuffle(pool).slice(0, n).map(c => makeQuestion(c, pool)), i: 0, picked: null, score: 0, missed: [] });
  renderQuiz(); startTimer();
}
function stopTimer() { if (S.qz.timer) { clearInterval(S.qz.timer); S.qz.timer = null; } }
function startTimer() {
  stopTimer(); if (!S.qz.pace) return;
  S.qz.t0 = Date.now();
  S.qz.timer = setInterval(() => {
    const left = PACE - (Date.now() - S.qz.t0) / 1000;
    const bar = $("#qtimer"); const lbl = $("#qtime");
    if (bar) { bar.querySelector("i").style.width = Math.max(0, left / PACE * 100) + "%"; bar.classList.toggle("low", left < 8); }
    if (lbl) lbl.textContent = Math.max(0, Math.ceil(left)) + " s left";
    if (left <= 0) answer(-1);
  }, 250);
}
function answer(idx) {

  stopTimer();

}

}
function renderQuiz() {

      <label class="check" for="qz-pace"><input type="checkbox" id="qz-pace" ${qz.pace ? "checked" : ""}> Exam pace: ${Math.round(PACE)} seconds a question, like the real final</label>

    const fb = !answered ? "" : `<div class="feedback" role="status">
      ${qz.picked === q.correct ? `<span class="ok">Correct</span>` : `<span class="no">${qz.picked === -1 ? "Out of time" : "Not quite"}</span><span>Answer: <b>${esc(q.options[q.correct])}</b></span>`}
      <span><b>${esc(q.card.front)}</b>: ${esc(q.card.back)}</span>${q.card.bd ? bd(q.card.bd) : ""}${q.card.cip && q.card.cip.ex[0] ? `<span>e.g. <b>${esc(q.card.cip.ex[0][0])}</b> = ${esc(q.card.cip.ex[0][1])}</span>` : ""}
    </div>`;
    html = `<div class="panel">
      <div class="qhead"><span>Question ${qz.i + 1} of ${qz.qs.length}</span><span>${qz.score} right${qz.pace ? `, <span id="qtime">${Math.round(PACE)} s left</span>` : ""}</span></div>
      ${qz.pace ? `<div class="timer" id="qtimer" aria-hidden="true"><i style="width:${answered ? 0 : 100}%"></i></div>` : ""}
      <div><p class="qlabel">${esc(q.label)}</p><div class="qprompt ${q.long ? "long" : ""}">${esc(q.prompt)}</div></div>
      <div class="options">${q.options.map((o, i) => {
        let cls = "opt"; if (answered) { if (i === q.correct) cls += " right"; else if (i === qz.picked) cls += " wrong"; }
        return `<button class="${cls}" data-opt="${i}" ${answered ? "disabled" : ""}><kbd>${i + 1}</kbd><span>${esc(o)}</span></button>`;
      }).join("")}</div>
      ${fb}
      <div class="row" style="justify-content:space-between"><button class="link" id="qz-quit">End quiz</button>${answered ? `<button class="btn solid" id="q-next">${qz.i + 1 >= qz.qs.length ? "See results" : "Next question"}</button>` : ""}</div>
    </div>`;
  } else {
    const answered = qz.i + (qz.picked !== null ? 1 : 0);
    const total = Math.max(1, answered);
    const pct = Math.round(qz.score / total * 100);
    html = `<div class="panel">
      <h2>Results</h2>
      <div class="score"><span class="num">${pct}%</span><span class="grade">${letter(pct)}</span><span>${qz.score} of ${answered} right</span></div>
      ${qz.missed.length ? `<div class="missed">${qz.missed.map(q => `<div><b>${esc(q.card.front)}</b>: ${esc(q.card.back)}</div>`).join("")}</div>` : `<p>Nothing missed. Try more questions or turn on exam pace.</p>`}
      <div class="row">${qz.missed.length ? `<button class="btn solid" id="qz-review">Study the ${qz.missed.length} I missed</button>` : ""}<button class="btn" id="qz-again">New quiz</button></div>
      ${qz.missed.length ? `<p class="scale">Studying your misses marks them Again, so they come up first in the deck.</p>` : ""}
    </div>`;
  }
  $("#view").innerHTML = `${weekPicker()}<section class="quiz">${html}</section>`;
}

/* ---------- Render root ---------- */
function render() {
  document.querySelectorAll(".nav button").forEach(b => b.toggleAttribute("aria-current", b.dataset.view === S.view));
  document.querySelectorAll(".nav button[aria-current]").forEach(b => b.setAttribute("aria-current", "page"));
  if (S.view === "decks") { if (S.st) renderStudy(); else renderDecks(); }
  else if (S.view === "guide") renderGuide();
  else renderQuiz();
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button, a[data-jump]"); if (!t) return;
  if (t.dataset.view) { if (t.dataset.view === "decks") S.st = null; return setView(t.dataset.view); }
  if (t.dataset.unit) return setUnit(t.dataset.unit);
  if (t.dataset.jump) { e.preventDefault(); const s = document.getElementById("sec-" + t.dataset.jump); if (s) s.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); return; }
  if (t.dataset.toggle) {
    const k = t.dataset.toggle; S.open = S.open.includes(k) ? S.open.filter(x => x !== k) : S.open.concat(k);
    store.set("open", S.open); return renderDecks();
  }
  if (t.dataset.study) {
    const k = t.dataset.study; const w = DECKS[k].week;
    if (w) { S.unit = unitOf(w); store.set("unit", S.unit); if (!S.open.includes(w)) { S.open = S.open.concat(w); store.set("open", S.open); } }
    S.view = "decks"; store.set("view", "decks"); try { history.replaceState(null, "", "#decks"); } catch (err) {}
    document.querySelectorAll(".nav button").forEach(b => { if (b.dataset.view === "decks") b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    return openStudy(k);
  }
  if (t.dataset.quizdeck) {
    const k = t.dataset.quizdeck; S.qz.deck = k; S.qz.phase = "setup";
    S.unit = k === "all" ? "w8" : unitOf(DECKS[k].week); store.set("unit", S.unit);
    return setView("quiz");
  }
  if (t.hasAttribute("data-back")) { S.st = null; return renderDecks(); }
  // study
  if (t.id === "st-show") return showAnswer();
  if (t.dataset.rate) return rate(+t.dataset.rate);
  if (t.id === "st-undo") return undo();
  if (t.id === "st-ahead") { S.st.ahead = true; pickNext(); return renderStudy(); }
  if (t.id === "st-reset") {
    const st = S.st;
    if (!st.armed) { st.armed = true; renderStudy(); setTimeout(() => { if (S.st === st && st.armed) { st.armed = false; renderStudy(); } }, 4000); return; }
    DECKS[st.key].cards.forEach(c => delete srs.c[c.id]); saveSrs();
    return openStudy(st.key);
  }
  // quiz
  if (t.dataset.len) { S.qz.len = +t.dataset.len; return renderQuiz(); }
  if (t.id === "qz-start") return startQuiz();
  if (t.dataset.opt != null) return answer(+t.dataset.opt);
  if (t.id === "q-next") return nextQ();
  if (t.id === "qz-quit") { stopTimer(); S.qz.phase = "done"; return renderQuiz(); }
  if (t.id === "qz-again") { S.qz.phase = "setup"; return renderQuiz(); }
  if (t.id === "qz-review") {
    S.qz.missed.forEach(q => { const s = srs.c[q.card.id] || { g: 0, e: 2.5, r: 0, l: 0 }; srs.c[q.card.id] = Object.assign({}, s, { g: 3, d: srs.clock, e: Math.max(1.3, (s.e || 2.5) - 0.2) }); });
    saveSrs();
    const k = quizDeckKey();
    S.view = "decks"; store.set("view", "decks"); try { history.replaceState(null, "", "#decks"); } catch (err) {}
    render(); return openStudy(k);
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "st-ask") { S.ask = e.target.value; store.set("ask", S.ask); if (S.st) { S.st.shown = false; renderStudy(); } }
  if (e.target.id === "qz-pace") S.qz.pace = e.target.checked;
  if (e.target.id === "qz-deck") { S.qz.deck = e.target.value; renderQuiz(); }
});
document.addEventListener("input", e => { if (e.target.id === "gsearch") { S.q = e.target.value; applyFilter(); } });
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const onButton = !!e.target.closest("button");
  if (S.view === "decks" && S.st) {
    const st = S.st;
    if (e.key === "Escape") { S.st = null; return renderDecks(); }
    if ((e.key === "z" || e.key === "u") && st.undo) { e.preventDefault(); return undo(); }
    if (!st.cur) return;
    if (!st.shown) {
      if ((e.key === " " || e.key === "Enter") && !onButton) { e.preventDefault(); showAnswer(); }
    } else {
      if (/^[1-4]$/.test(e.key)) { e.preventDefault(); rate(+e.key); }
      else if ((e.key === " " || e.key === "Enter") && !onButton) { e.preventDefault(); rate(3); }
    }
  } else if (S.view === "quiz" && S.qz.phase === "q") {
    if (onButton && (e.key === " " || e.key === "Enter")) return;
    const q = S.qz.qs[S.qz.i];
    if (S.qz.picked === null && /^[1-4]$/.test(e.key) && +e.key <= q.options.length) { e.preventDefault(); answer(+e.key - 1); }
    else if (S.qz.picked !== null && e.key === "Enter") { e.preventDefault(); nextQ(); }
  }
});
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS.includes(v) && v !== S.view) setView(v); });

render();
</script>
</body>
</html>
