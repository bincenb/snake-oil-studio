<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake Oil Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Public+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Single committed look: a late-night "studio" control room. Painted explicitly for any host theme. */
  :root {
    color-scheme: dark;
    --ink: #13212E;
    --panel: #1C2E3E;
    --panel-2: #22384B;
    --line: #2E4457;
    --paper: #F6F3EC;
    --paper-2: #E9E4D8;
    --muted: #BFC9D1;
    --muted-2: #8FA0AE;
    --coral: #F07A5A;
    --coral-deep: #B83A20;
    --teal: #5CC2B0;
    --teal-deep: #1F7A6D;
    --text-on-paper: #13212E;
    --muted-on-paper: #4A5560;
    --display: 'Oswald', 'Arial Narrow', Arial, sans-serif;
    --body: 'Public Sans', Arial, Helvetica, sans-serif;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
  }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.5;
    padding-inline: 16px;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding-block: 16px 64px; display: flex; flex-direction: column; gap: 20px; }

  /* Header */
  .top { display: flex; flex-direction: column; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--ink); padding-block: 12px; z-index: 5; border-bottom: 1px solid var(--line); }
  .brand-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: 2px; text-transform: uppercase; }
  .brand span { color: var(--coral); }
  .meter { font-family: var(--mono); font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
  .meter b { color: var(--coral); font-size: 18px; font-variant-numeric: tabular-nums; }
  .stages { display: flex; gap: 6px; flex-wrap: wrap; list-style: none; padding: 0; margin: 0; }
  .stages li { font-family: var(--display); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; padding: 3px 9px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted-2); }
  .stages li.done { color: var(--muted); border-color: var(--muted-2); }
  .stages li.now { background: var(--coral); border-color: var(--coral); color: var(--ink); font-weight: 600; }
  .stages li.now.flip { background: var(--teal); border-color: var(--teal); }

  /* Type */
  h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.1; text-wrap: balance; margin: 0; }
  h1 { font-size: clamp(44px, 11vw, 76px); letter-spacing: 1px; text-transform: uppercase; }
  h2 { font-size: clamp(28px, 6vw, 38px); }
  h3 { font-size: 22px; }
  p { margin: 0; max-width: 65ch; }
  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--coral); }
  .eyebrow.teal { color: var(--teal); }
  .lead { font-size: 19px; color: var(--paper); }
  .muted { color: var(--muted); }
  .small { font-size: 14px; color: var(--muted); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }

  /* Buttons */
  button { font: inherit; cursor: pointer; }
  .btn { font-family: var(--display); font-size: 18px; letter-spacing: 1px; text-transform: uppercase; padding: 12px 22px; border-radius: 6px; border: 2px solid var(--coral); background: var(--coral); color: var(--ink); font-weight: 600; }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; color: var(--paper); border-color: var(--muted-2); }
  .btn.teal { background: var(--teal); border-color: var(--teal); }
  .btn:focus-visible, .choice:focus-visible, .copy:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }

  .choice { text-align: start; width: 100%; background: var(--panel); color: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
  .choice:hover { border-color: var(--coral); }
  .choice .k { font-family: var(--mono); font-size: 13px; color: var(--muted-2); }
  .choice.picked { border-color: var(--coral); background: var(--panel-2); }
  .choice.win { border-color: var(--coral); }
  .choice[disabled] { cursor: default; }
  .choice[disabled]:not(.picked) { opacity: .6; }

  /* Panels */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .boss { border-inline-start: 4px solid var(--coral); background: var(--panel); padding: 14px 18px; border-start-end-radius: 8px; border-end-end-radius: 8px; }
  .boss .who { font-family: var(--mono); font-size: 13px; color: var(--coral); margin-bottom: 4px; }
  .lesson { background: var(--panel); border: 1px solid var(--teal-deep); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .lesson .tag { font-family: var(--display); letter-spacing: 1.5px; text-transform: uppercase; font-size: 14px; color: var(--teal); }
  .defense { border-top: 1px dashed var(--line); padding-top: 10px; color: var(--paper); }
  .defense b { color: var(--teal); }

  /* Engagement bars */
  .bars { display: flex; flex-direction: column; gap: 10px; }
  .bar { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
  .bar .lbl { font-size: 15px; color: var(--muted); }
  .bar .num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 15px; }
  .bar .track { grid-column: 1 / -1; height: 10px; background: var(--ink); border-radius: 5px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--muted-2); border-radius: 5px; width: 0; transition: width .9s ease; }
  .bar.hot .fill { background: var(--coral); }

  /* Post card (phone feed) */
  .post { background: var(--paper); color: var(--text-on-paper); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .post .hd { display: flex; gap: 12px; align-items: center; }
  .post .av { width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--display); font-weight: 700; color: var(--paper); font-size: 18px; }
  .post .nm { font-weight: 700; font-size: 16px; line-height: 1.2; }
  .post .hn { font-size: 14px; color: var(--muted-on-paper); }
  .post .tx { font-size: 18px; line-height: 1.45; }
  .post .ct { font-size: 14px; color: var(--muted-on-paper); border-top: 1px solid var(--paper-2); padding-top: 8px; }
  .post .vid { background: var(--ink); color: var(--muted); border-radius: 10px; padding: 26px; text-align: center; font-family: var(--mono); font-size: 13px; }
  .stamp { position: absolute; inset-inline-end: 14px; top: 14px; transform: rotate(-8deg); border: 3px solid var(--coral-deep); color: var(--coral-deep); font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: 1px; padding: 3px 8px; border-radius: 4px; background: rgba(246,243,236,.92); }
  .anno { display: inline-block; font-family: var(--display); font-weight: 700; font-size: 13px; background: var(--coral-deep); color: var(--paper); border-radius: 3px; padding: 0 6px; margin-inline-end: 6px; vertical-align: 2px; }

  .judge { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .judge .btn { width: 100%; }
  .counter { font-family: var(--mono); font-size: 14px; color: var(--muted); }

  .fb { border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; border: 2px solid var(--teal); background: var(--panel); }
  .fb.wrong { border-color: var(--coral); }
  .fb .res { font-family: var(--display); font-size: 22px; letter-spacing: .5px; }
  .fb.right .res { color: var(--teal); }
  .fb.wrong .res { color: var(--coral); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-family: var(--display); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; border: 1px solid var(--coral); color: var(--coral); border-radius: 3px; padding: 1px 7px; }
  .chip.ok { border-color: var(--teal); color: var(--teal); }

  /* Chat terminal */
  .term { background: #0B141C; border: 1px solid var(--line); border-radius: 10px; padding: 16px; font-family: var(--mono); font-size: 14px; line-height: 1.6; display: flex; flex-direction: column; gap: 12px; }
  .term .you { color: var(--teal); }
  .term .bot { color: var(--paper); white-space: pre-wrap; }
  .term .sys { color: var(--muted-2); }
  .term .who { color: var(--muted-2); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .search { background: var(--paper); color: var(--text-on-paper); border-radius: 8px; padding: 14px; font-size: 15px; display: flex; flex-direction: column; gap: 6px; }
  .search .q { font-family: var(--mono); font-size: 13px; background: var(--paper-2); padding: 6px 8px; border-radius: 4px; overflow-wrap: anywhere; }
  .search .zero { font-weight: 700; color: var(--coral-deep); }

  /* Results */
  .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .score { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 4px; }
  .score .big { font-family: var(--display); font-size: 54px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .score.after { border-color: var(--teal); }
  .score.after .big { color: var(--teal); }
  table.bd { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.bd th, table.bd td { text-align: start; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  table.bd td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .card3 { background: var(--paper); color: var(--text-on-paper); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .card3 .t { font-family: var(--display); font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: var(--teal-deep); font-weight: 700; }
  .card3 ol { margin: 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 8px; }
  .card3 li b { font-family: var(--display); font-size: 18px; letter-spacing: .5px; }
  .copybox { background: #0B141C; border: 1px dashed var(--teal); border-radius: 8px; padding: 14px; font-family: var(--mono); font-size: 14px; color: var(--paper); overflow-wrap: anywhere; }
  .copy { font-family: var(--display); letter-spacing: 1px; text-transform: uppercase; font-size: 14px; background: transparent; border: 1px solid var(--teal); color: var(--teal); border-radius: 5px; padding: 6px 12px; align-self: flex-start; }
  .fakes-list { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .fakes-list div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 8px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
  .fakes-list .L { font-family: var(--display); font-size: 34px; font-weight: 700; color: var(--coral); line-height: 1; }
  .fakes-list .W { font-size: 12px; color: var(--muted); line-height: 1.3; }

  .intro-stamp { align-self: flex-start; transform: rotate(-4deg); border: 3px solid var(--coral); color: var(--coral); font-family: var(--display); font-weight: 700; letter-spacing: 1.5px; padding: 4px 12px; border-radius: 4px; font-size: 15px; }
  a { color: var(--teal); }
  .fade-in { animation: fi .35s ease both; }
  @keyframes fi { from { opacity: .001; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } .bar .fill { transition: none; } }
  @media (max-width: 520px) {
    .fakes-list { grid-template-columns: repeat(5, 1fr); gap: 4px; }
    .fakes-list .W { font-size: 11px; }
    .judge { grid-template-columns: 1fr 1fr; }
    .top { gap: 8px; padding-block: 8px; }
    .brand { font-size: 18px; letter-spacing: 1.5px; }
    .stages { gap: 4px; }
    .stages li { font-size: 11px; padding: 2px 6px; letter-spacing: .5px; }
  }

  [hidden] { display: none !important; }
  /* v2 additions */
  .post.ai { border: 2px solid var(--line); }
  .post.ai .av { border-radius: 10px; font-size: 15px; }
  details.key summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
  details.key summary:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
  .keylist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .keyrow { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; border-top: 1px solid var(--line); padding-top: 12px; }
  .keyrow .ktext { font-size: 15px; margin-bottom: 4px; }
  .kbadge { font-family: var(--display); font-size: 13px; letter-spacing: 1px; border-radius: 3px; padding: 2px 8px; font-weight: 700; }
  .kbadge.real { background: var(--teal); color: var(--ink); }
  .kbadge.fake { background: var(--coral); color: var(--ink); }
  .mission { border-color: var(--coral); }
  .steps { margin: 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 6px; }
</style>
<style>*,*::before,*::after{box-sizing:border-box} body{margin:0} img{max-width:100%}</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="brand-row">
      <div class="brand" id="brand">Snake Oil <span>Studio</span></div>
      <div class="meter" id="meter" hidden><span id="meter-label">shares</span> <b id="shares">0</b></div>
    </div>
    <ol class="stages" id="stages" aria-label="Game progress"></ol>
  </header>
  <main id="screen" class="stack" aria-live="polite"></main>
</div>

<script>
/* =====================================================================

        it (for example "ar"). Set name, locale and dir ("rtl" for Arabic).
     2. Translate the text between the quotes. Keep {curly} words as they
        are: the game fills them in.
     3. Swap in local myths: edit the posts in posts.A and posts.B. Keep
        4 real + 4 fake in each set, and a trusted source for every real one.
     4. Open the game with #ar at the end of the link (or pick the language
        on the start screen). Add -control for the comparison group: #ar-control

(function () {

  let RETEST = hashTokens.includes('retest'); // one-week check with set C

  const num = n => Number(n).toLocaleString(L.locale);
  const allPosts = () => L.posts.A.concat(L.posts.B);
  const byId = id => allPosts().concat(L.posts.C || []).find(p => p.id === id);
  const TKEYS = ['F', 'A', 'K', 'E', 'S'];

  }

  let S;
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function fresh() {
    const order = Math.random() < 0.5 ? ['A', 'B'] : ['B', 'A'];
    const arm = RETEST ? 'R' : CONTROL ? 'C' : STUDY ? (Math.random() < 0.5 ? 'G' : 'C') : 'G';
    return {
      screen: 'intro', order: RETEST ? ['C', '-'] : order, arm, lang: langKey,
      preItems: shuffle(L.posts[RETEST ? 'C' : order[0]].map(p => p.id)),
      postItems: RETEST ? [] : shuffle(L.posts[order[1]].map(p => p.id)),
      pre: {}, post: {}, i: 0, shares: 0, headline: null, spokesperson: null, enemy: null, kStep: 0
    };
  }

  // ---------- Chrome ----------
  const STAGE_OF = { intro: 0, before: 0, wait: 6, brief: 1, F: 1, A: 2, K: 3, E: 4, S: 5, flipIntro: 6, flip: 6, results: 7 };

    $('#meter').hidden = !['F', 'A', 'K', 'E', 'S'].includes(S.screen);
    $('#shares').textContent = num(S.shares);

  function bumpShares(to) {
    const el = $('#shares'); const from = S.shares; S.shares = to;

    const t0 = performance.now(), dur = 900;
    (function step(t) { const k = Math.min(1, (t - t0) / dur); el.textContent = num(Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(step); })(t0);

      <div class="judge">
        <button class="btn ${phase === 'post' ? 'teal' : ''}" data-v="1" ${answered ? 'disabled' : ''}>${esc(L.ui.trust)}</button>
        <button class="btn ghost" data-v="0" ${answered ? 'disabled' : ''}>${esc(L.ui.dont)}</button>
      </div>
      ${plain ? `<p class="small">${esc(L.ui.gut)}</p>` : ''}
      ${fb}`;
  }
  function judgeAfter(phase) {
    const items = phase === 'pre' ? S.preItems : S.postItems;
    const p = byId(items[S.i]);
    const advance = end => { if (S.i < items.length - 1) { S.i++; render(); } else go(end); };
    document.querySelectorAll('.judge .btn').forEach(b => b.onclick = () => {
      S[phase][p.id] = b.dataset.v === '1';
      if (phase === 'pre') advance(S.arm === 'R' ? 'results' : S.arm === 'C' ? 'wait' : 'brief');
      else if (S.arm === 'C') advance('results');
      else { render(); const n = $('#next'); if (n) n.focus(); }
    });
    const n = $('#next'); if (n) n.onclick = () => advance('results');
  }
  R.before = () => judgeScreen('pre'); R.before.after = () => judgeAfter('pre');
  R.flip = () => judgeScreen('post'); R.flip.after = () => judgeAfter('post');

  R.wait = () => `
    <div class="eyebrow teal">${esc(L.wait.eyebrow)}</div>
    <h2>${esc(L.wait.title)}</h2>
    <p class="lead">${esc(L.wait.lead)}</p>
    <div class="score"><span class="small">${esc(L.wait.left)}</span><span class="big" id="timer">8:00</span></div>
    <div class="row"><button class="btn teal" id="go" disabled>${esc(L.wait.go)}</button></div>
    <p class="small">${esc(L.wait.note)}</p>`;
  R.wait.after = () => {
    const end = Date.now() + 8 * 60 * 1000; const g = $('#go');
    const t = setInterval(() => {
      const el = $('#timer'); if (!el) { clearInterval(t); return; }
      const left = Math.max(0, end - Date.now());
      el.textContent = Math.floor(left / 60000) + ':' + String(Math.floor(left / 1000) % 60).padStart(2, '0');
      if (left === 0) { clearInterval(t); g.disabled = false; }
    }, 250);
    g.onclick = () => go('flip');
  };

  R.brief = () => `
    <div class="eyebrow">${esc(L.brief.eyebrow)}</div>
    <h2>${esc(L.brief.title)}</h2>
    <p class="lead">${esc(L.brief.lead)}</p>
    ${boss(L.brief.boss)}
    <div class="panel"><p class="muted">${esc(L.brief.recipe)}</p>${fakesGrid()}</div>
    <div class="row"><button class="btn" id="go">${esc(L.brief.go)}</button></div>`;
  R.brief.after = () => $('#go').onclick = () => go('F');

  R.F = () => {
    const T = L.F, h = S.headline, win = T.counts.length - 1, done = h === win;
    return `
      <div class="eyebrow">${esc(T.eyebrow)}</div>
      <h2>${esc(T.title)}</h2>
      <div class="stack">${T.options.map((x, i) => `<button class="choice ${h === i ? 'picked' : ''}" data-i="${i}" ${done ? 'disabled' : ''}><span class="k">${esc(T.label)} ${String.fromCharCode(65 + i)}</span>${esc(x)}</button>`).join('')}</div>
      ${h !== null && !done ? boss(esc(fmt(T.reject, { n: num(T.counts[h]) }))) : ''}
      ${done ? `${boss(esc(T.win))}
        <div class="panel fade-in"><h3>${esc(T.chart)}</h3>${bars(T.options, T.counts, win)}</div>
        ${lesson(whatTag(), T.lesson, T.defense)}
        <div class="row"><button class="btn" id="go">${esc(T.go)}</button></div>` : ''}`;
  };
  R.F.after = () => {
    document.querySelectorAll('.choice').forEach(b => b.onclick = () => { const i = +b.dataset.i; S.headline = i; bumpShares(L.F.counts[i]); render(); });
    const g = $('#go'); if (g) g.onclick = () => go('A');
  };

  R.A = () => {
    const T = L.A, s = S.spokesperson, done = s === 2;
    return `
      <div class="eyebrow">${esc(T.eyebrow)}</div>
      <h2>${esc(T.title)}</h2>
      <div class="stack">${T.options.map((x, i) => `<button class="choice ${s === i ? 'picked' : ''}" data-i="${i}" ${done ? 'disabled' : ''}>${esc(x)}</button>`).join('')}</div>
      ${s !== null ? boss(esc(T.replies[s])) : ''}
      ${done ? `${postHTML({ name: 'Dr. Glow, MD', handle: '@DrGlowWellness · Sponsored', color: '#B83A20', video: true, text: T.glowText, cites: 'none yet' }, { stamp: true })}
        ${lesson(whatTag(), T.lesson, T.defense)}
        <div class="row"><button class="btn" id="go">${esc(T.go)}</button></div>` : ''}`;
  };
  R.A.after = () => {
    document.querySelectorAll('.choice').forEach(b => b.onclick = () => { const i = +b.dataset.i; S.spokesperson = i; if (i === 2) bumpShares(S.shares + 41200); render(); });
    const g = $('#go'); if (g) g.onclick = () => go('K');
  };

  function typeInto(el, text, done) {
    if (!el) return;
    if (reduced) { el.textContent = text; done && done(); return; }
    let i = 0; el.textContent = '';
    const t = setInterval(() => { i += 3; el.textContent = text.slice(0, i); if (i >= text.length) { clearInterval(t); done && done(); } }, 12);
  }
  R.K = () => {
    const T = L.K, k = S.kStep;
    return `
      <div class="eyebrow">${esc(T.eyebrow)}</div>
      <h2>${esc(T.title)}</h2>
      <div class="term" aria-label="AI chat">
        <div class="who">${esc(T.bot)}</div>
        ${k === 0 ? `<button class="choice" id="ask"><span class="k">${esc(T.send)}</span><span style="font-family:var(--mono)">${esc(T.prompt)}</span></button>` :
          `<div class="you">&gt; ${esc(T.prompt)}</div><div class="bot" id="bot1"></div>`}
      </div>
      ${k >= 1 ? `<div id="k1" ${k === 1 ? 'hidden' : ''} class="stack">
        ${boss(esc(T.boss1))}
        <div class="row"><button class="btn ghost" id="check" ${k >= 2 ? 'disabled' : ''}>${esc(T.check)}</button></div></div>` : ''}
      ${k >= 2 ? `<div class="stack fade-in">
        ${T.refs.map(r => `<div class="search"><div class="small" style="color:var(--muted-on-paper)">${esc(T.searchLabel)}</div><div class="q">${esc(r.split('. ')[1])}</div><div class="zero">${esc(T.zero)}</div></div>`).join('')}
        ${lesson(whatTag(), T.lesson, T.defense)}
        ${k === 2 ? `<div class="row"><button class="btn teal" id="skeptic">${esc(T.trySkeptic)}</button></div>` : ''}</div>` : ''}
      ${k >= 3 ? `<div class="term fade-in">
        <div class="who">${esc(T.botSkeptic)}</div>
        <div class="you">&gt; ${esc(T.skeptic)}</div>
        <div class="you">&gt; ${esc(T.prompt)}</div>
        <div class="bot" id="bot2"></div></div>
      <div id="k3" ${k === 3 ? 'hidden' : ''} class="stack">
        <p class="muted">${T.after}</p>
        ${boss(esc(T.boss2))}
        <div class="row"><button class="btn" id="go">${esc(T.go)}</button></div></div>` : ''}`;
  };
  R.K.after = () => {
    const T = L.K, k = S.kStep;
    const bot1 = T.botIntro + '\n\n' + T.refs.map((r, i) => `${i + 1}. ${r}`).join('\n') + '\n\n' + T.botOutro;
    const ask = $('#ask'); if (ask) ask.onclick = () => { S.kStep = 1; render(); };
    if (k === 1) typeInto($('#bot1'), bot1, () => { S.kStep = 1.5; const e = $('#k1'); if (e) e.hidden = false; });
    else if ($('#bot1')) $('#bot1').textContent = bot1;
    const c = $('#check'); if (c) c.onclick = () => { S.kStep = 2; render(); };
    const sk = $('#skeptic'); if (sk) sk.onclick = () => { S.kStep = 3; render(); };
    if (k === 3) typeInto($('#bot2'), T.honest, () => { S.kStep = 3.5; const e = $('#k3'); if (e) e.hidden = false; bumpShares(S.shares + 26900); });
    else if ($('#bot2')) $('#bot2').textContent = T.honest;
    const g = $('#go'); if (g) g.onclick = () => go('E');
  };

  R.E = () => {
    const T = L.E, e = S.enemy;
    return `
      <div class="eyebrow">${esc(T.eyebrow)}</div>
      <h2>${esc(T.title)}</h2>
      <div class="stack">${T.options.map((x, i) => `<button class="choice ${e === i ? 'picked' : ''}" data-i="${i}" ${e !== null ? 'disabled' : ''}><span class="k">${esc(T.blame)}</span>${esc(x)}</button>`).join('')}</div>
      ${e !== null ? `${boss(esc(T.boss))}
        <div class="panel fade-in"><div class="small">${esc(T.commentsOn)} “${esc(T.lines[e])}”</div>${T.comments.map(c => `<p>“${esc(c)}”</p>`).join('')}</div>
        ${lesson(whatTag(), T.lesson, T.defense)}
        <div class="row"><button class="btn" id="go">${esc(T.go)}</button></div>` : ''}`;
  };
  R.E.after = () => {
    document.querySelectorAll('.choice').forEach(b => b.onclick = () => { S.enemy = +b.dataset.i; bumpShares(S.shares + 88500); render(); });
    const g = $('#go'); if (g) g.onclick = () => go('S');
  };

  R.S = () => {
    const T = L.S, launched = S.shares >= 1000000;
    const txt = `<span class="anno">F</span>${esc(L.F.options[L.F.options.length - 1])}<br><br><span class="anno">E</span>${esc(L.E.lines[S.enemy == null ? 0 : S.enemy])}<br><br><span class="anno">A</span>“${esc(L.A.glowText)}”<br><br><span class="anno">S</span>${esc(T.sale)}`;
    return `
      <div class="eyebrow">${esc(T.eyebrow)}</div>
      <h2>${esc(launched ? T.viral : T.ready)}</h2>
      ${postHTML({ name: 'Dr. Glow, MD', handle: '@DrGlowWellness · Sponsored', color: '#B83A20', video: true, cites: T.cites }, { stamp: true, textHTML: txt })}
      ${!launched ? `<div class="row"><button class="btn" id="launch">${esc(T.launch)}</button></div>` : `
        ${boss(esc(T.boss))}
        <section class="panel fade-in" style="border-color:var(--coral)">
          <div class="eyebrow">${esc(T.costTitle)}</div>
          <p>${esc(T.cost)}</p>
          <p class="muted">${esc(T.costReal)}</p>
        </section>
        ${lesson(esc(T.used), fakesGrid(), T.defense)}
        <div class="row"><button class="btn teal" id="go">${esc(T.go)}</button></div>`}`;
  };
  R.S.after = () => {
    const l = $('#launch'); if (l) l.onclick = () => { bumpShares(1200000); setTimeout(() => { S.shares = 1200000; render(); }, reduced ? 0 : 950); };
    const g = $('#go'); if (g) g.onclick = () => go('flipIntro');
  };

  R.flipIntro = () => {
    const T = L.flipIntro;
    return `
    <div class="eyebrow teal">${esc(T.eyebrow)}</div>
    <h2>${esc(T.title)}</h2>
    <p class="lead">${esc(T.lead)}</p>
    <div class="card3"><div class="t">${esc(T.card)}</div><ol>${T.checks.map(c => `<li>${c}</li>`).join('')}</ol></div>
    <p class="muted">${T.note}</p>
    <div class="row"><button class="btn teal" id="go">${esc(T.go)}</button></div>`;
  };
  R.flipIntro.after = () => $('#go').onclick = () => go('flip');

  function tally(phase, items) {
    let realOk = 0, fakeOk = 0, real = 0, fake = 0;
    items.forEach(id => { const p = byId(id); const t = S[phase][id]; if (p.real) { real++; if (t === true) realOk++; } else { fake++; if (t === false) fakeOk++; } });
    return { realOk, fakeOk, real, fake, total: realOk + fakeOk, n: items.length };
  }
  R.results = () => {
    const T = L.results;
    if (S.arm === 'R') {
      const r = tally('pre', S.preItems);
      const rcode = `SOS2 R ${langKey} C retest R${r.realOk}/${r.real} F${r.fakeOk}/${r.fake}`;
      const kr = p => `<li class="keyrow"><span class="kbadge ${p.real ? 'real' : 'fake'}">${esc(p.real ? T.real : T.fake)}</span><div><div class="ktext">${esc(p.text)}</div><div class="small">${esc(p.why)}</div></div></li>`;
      return `
      <div class="eyebrow teal">${esc(T.eyebrow)}</div>
      <h2>${esc(T.retestTitle)}: ${r.total}/${r.n}</h2>
      <div class="panel" style="overflow-x:auto"><table class="bd"><tbody>
        <tr><td>${esc(T.rowReal)}</td><td class="n">${r.realOk}/${r.real}</td></tr>
        <tr><td>${esc(T.rowFake)}</td><td class="n">${r.fakeOk}/${r.fake}</td></tr></tbody></table></div>
      <section class="panel">
        <h3>${esc(T.testTitle)}</h3>
        <p class="muted">${esc(T.testNote)}</p>
        <div class="copybox" id="code-text">${esc(rcode)}</div>
        <button class="copy" data-copy="code-text" data-label="${esc(T.copyCode)}">${esc(T.copyCode)}</button>
      </section>
      <details class="panel key" open>
        <summary><b>${esc(T.keyTitleC)}</b></summary>
        <ul class="keylist">${L.posts.C.map(kr).join('')}</ul>
      </details>
      <div class="card3"><div class="t">${esc(T.keep)}</div><ol>${T.keepChecks.map(c => `<li>${c}</li>`).join('')}</ol></div>
      <div class="row"><button class="btn ghost" id="again">${esc(T.again)}</button></div>`;
    }
    const a = tally('pre', S.preItems), b = tally('post', S.postItems), d = b.total - a.total;
    const verdict = d > 0 ? fmt(T.up, { n: d, posts: d === 1 ? T.post : T.postsWord }) : d === 0 ? T.same : T.down;
    const code = `SOS2 ${S.arm} ${langKey} ${S.order[0]}>${S.order[1]} pre R${a.realOk}/${a.real} F${a.fakeOk}/${a.fake} post R${b.realOk}/${b.real} F${b.fakeOk}/${b.fake}`;
    const keyRow = p => `<li class="keyrow"><span class="kbadge ${p.real ? 'real' : 'fake'}">${esc(p.real ? T.real : T.fake)}</span><div><div class="ktext">${esc(p.text)}</div><div class="small">${esc(p.why)}</div></div></li>`;
    return `
      <div class="eyebrow teal">${esc(T.eyebrow)}</div>
      <h2>${esc(verdict)}</h2>
      <div class="score-grid">
        <div class="score"><span class="small">${esc(T.before)}</span><span class="big">${a.total}/${a.n}</span></div>
        <div class="score after"><span class="small">${esc(T.after)}</span><span class="big">${b.total}/${b.n}</span></div>
      </div>
      <div class="panel" style="overflow-x:auto">
        <table class="bd">
          <thead><tr><th></th><th>${esc(T.before)}</th><th>${esc(T.after)}</th></tr></thead>
          <tbody>
            <tr><td>${esc(T.rowReal)}</td><td class="n">${a.realOk}/${a.real}</td><td class="n">${b.realOk}/${b.real}</td></tr>
            <tr><td>${esc(T.rowFake)}</td><td class="n">${a.fakeOk}/${a.fake}</td><td class="n">${b.fakeOk}/${b.fake}</td></tr>
          </tbody>
        </table>
        <p class="small">${T.bdNote}</p>
      </div>
      <details class="panel key">
        <summary><b>${esc(T.keyTitle)}</b> <span class="small">${esc(T.keyNote)}</span></summary>
        <ul class="keylist">${allPosts().map(keyRow).join('')}</ul>
      </details>
      <section class="panel mission">
        <h3>${esc(T.missionTitle)}</h3>
        <p class="muted">${esc(T.mission)}</p>
        <ol class="steps">${T.missionSteps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
      </section>
      <div class="card3"><div class="t">${esc(T.keep)}</div><ol>${T.keepChecks.map(c => `<li>${c}</li>`).join('')}</ol></div>
      <section class="panel">
        <h3>${esc(T.skepticTitle)}</h3>
        <p class="muted">${esc(T.skepticNote)}</p>
        <div class="copybox" id="skeptic-text">${esc(L.K.skeptic)}</div>
        <button class="copy" data-copy="skeptic-text" data-label="${esc(T.copyPrompt)}">${esc(T.copyPrompt)}</button>
      </section>
      <section class="panel">
        <h3>${esc(T.boosterTitle)}</h3>
        <p class="muted">${esc(T.booster)}</p>
      </section>
      <section class="panel">
        <h3>${esc(T.testTitle)}</h3>
        <p class="muted">${esc(T.testNote)}</p>
        <div class="copybox" id="code-text">${esc(code)}</div>
        <button class="copy" data-copy="code-text" data-label="${esc(T.copyCode)}">${esc(T.copyCode)}</button>
      </section>
      <div class="row"><button class="btn ${S.arm === 'C' ? '' : 'ghost'}" id="again">${esc(S.arm === 'C' ? T.fullGame : T.again)}</button></div>
      <p class="small">${esc(T.credit)}</p>`;
  };
  R.results.after = () => {
    const T = L.results;
    document.querySelectorAll('.copy').forEach(btn => btn.onclick = () => {
      const el = document.getElementById(btn.dataset.copy); const text = el.textContent;
      const ok = () => { btn.textContent = T.copied; setTimeout(() => btn.textContent = btn.dataset.label, 1600); };
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = T.selected; };
      try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
    });
    $('#again').onclick = () => { CONTROL = false; STUDY = false; RETEST = false; S = fresh(); render(); };
  };

  function render() { drawChrome(); screenEl.innerHTML = R[S.screen](); R[S.screen].after && R[S.screen].after(); }

  function start(data) {
    if (data && data.S && LANG[data.S.lang]) { langKey = data.S.lang; L = LANG[langKey]; S = data.S; } else S = fresh();
    if (S.kStep === 1.5) S.kStep = 1; if (S.kStep === 3.5) S.kStep = 3;
    applyLang(); render();
  }
  try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch (e) {}
  if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
</script>

</body>
</html>
